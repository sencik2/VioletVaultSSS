name: Unpack Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -o VioletVault_AppStudio.zip
          cp -r VioletVault_AppStudio/. .
          rm -rf VioletVault_AppStudio VioletVault_AppStudio.zip

      - name: Commit project
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Add Violet Vault Android project" || echo "Nothing to commit"
          git push
